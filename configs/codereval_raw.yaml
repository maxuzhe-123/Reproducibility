# ================================================================
# Experiment: CoderEval — No RAG, original docstring (CEPythonRaw)
# ----------------------------------------------------------------
# Prompt source : CEPythonRaw.jsonl (original docstring from the code)
# RAG        : none
# Evaluation : runner.eval_one + PythonExec
# ================================================================

model:
  provider: openrouter
#  model_id: "qwen/qwen-2.5-7b-instruct"
# model_id: qwen/qwen-2.5-72b-instruct
#  model_id: qwen/qwen3-coder-next
#  model_id: deepseek/deepseek-v3.2
#  --- Gemini 2.5 (for thinking experiments, uncomment one of these and enable the thinking block below) ---
#  model_id: google/gemini-2.5-pro
#  model_id: google/gemini-2.5-flash
#  model_id: google/gemini-2.5-flash-lite
#  model_id: anthropic/claude-sonnet-4.6
  model_id: openai/gpt-5.1-codex
  stop_strings: ["Stop."]
  max_new_tokens: 32768
  do_sample: true
  temperature: 0.6
  top_p: 0.95
  top_k: null
  reasoning:
    effort: low
    exclude: true

  # ===== thinking switch (only effective for Gemini/Claude; uncomment when running thinking experiments with Gemini) =====
  # When enabled, the file name becomes tem_<t>_thinking_<budget|effort> (top_p/top_k are dropped automatically).
  # Pro cannot disable thinking (minimum ~128); flash / flash-lite can (enabled: false or budget: 0).
  # Note: when thinking is enabled for Claude, temperature must be 1.0 (Gemini has no such restriction).
#  thiue         # do not return thinking text (tokens still count toward the budget)

experiment:
  dataset: codereval
#  name: codereval_no_rag_raw
#  out_dir: runs/codereval
#  out_dir: runs/codereval_test
  num_tasks: 230
#  num_tasks: 2
  num_samples: 10
  timeout_sec: 30

prompt:
  template: "codereval_raw"
# no template needed: prompt is taken directly from CEPythonRaw.jsonl input field

codereval:
  index_path: src/datasets/CoderEval/CoderEval4Python.json
  repos_root: repos
  docstring_source: raw        # CEPythonRaw.jsonl — original docstring from the code

rag:
  mode: no_rag
  window_sizes: [20]
  slice_sizes: [2]
  retriever: one-gram
  top_k: 3
